services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ecs_app
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?パスワードを設定してください}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "db_admin", "-d", "ecs_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
