version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/"]
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: "npm"
    directories: ["/apps/storefront", "/infra/cdk"]
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: "uv"
    directories: ["/apps/product-api"]
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: "terraform"
    directories: ["/infra/terraform/env/stg/network"]
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
