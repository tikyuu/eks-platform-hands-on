name: Storefront CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/storefront/**'
      - '.github/workflows/storefront-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: フロントのDockerビルド
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: フロントのイメージをビルド
        run: docker build --file apps/storefront/Dockerfile --tag storefront:ci apps/storefront
