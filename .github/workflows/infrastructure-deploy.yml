name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: '対象スタック（依存スタックも処理対象に含まれる場合があります）'
        type: choice
        required: true
        default: EcsStack
        options:
          - EcsStack
          - NetworkStack
          - EcrStack
          - GitHubActionsStack
          - DatabaseStack
          - 全スタック
      deploy:
        description: '差分確認後にAWSへデプロイする（AWSリソースの変更・費用が発生する可能性があります）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: インフラを更新
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 選択したスタックをCDKの実行対象に設定
        env:
          SELECTED_STACK: ${{ inputs.stack }}
        run: |
          if [[ "$SELECTED_STACK" == "全スタック" ]]; then
            CDK_TARGET="--all"

          elif [[ "$SELECTED_STACK" == "EcsStack" ||
                  "$SELECTED_STACK" == "NetworkStack" ||
                  "$SELECTED_STACK" == "EcrStack" ||
                  "$SELECTED_STACK" == "GitHubActionsStack" ||
                  "$SELECTED_STACK" == "DatabaseStack" ]]; then
            CDK_TARGET="$SELECTED_STACK"

          else
            echo "::error::対象スタックの選択が不正です。"
            exit 1
          fi

          # 後続のsynth・diffで使えるように保存する
          echo "CDK_TARGET=$CDK_TARGET" >> "$GITHUB_ENV"

      - name: Node.js 24を準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: CDKの依存ライブラリをインストール
        run: npm ci
        working-directory: infra/cdk

      - name: CDKをビルド
        run: npm run build
        working-directory: infra/cdk

      - name: AWSへ認証
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 使用中のタスク定義ARNを取得
        if: inputs.stack == 'EcsStack' || inputs.stack == '全スタック'
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster ecs-stg-cluster \
            --services ecs-stg-service-product-api \
            --query 'services[0].taskDefinition' \
            --output text)

          # タスク定義ARNの形式（末尾のリビジョン番号まで必要）
          TASK_DEFINITION_ARN_PATTERN='^arn:[a-z0-9-]+:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/[A-Za-z0-9_-]+:[1-9][0-9]*$'

          # 取得結果がその形式でなければ停止する
          if [[ ! "$TASK_DEFINITION_ARN" =~ $TASK_DEFINITION_ARN_PATTERN ]]; then
            echo "::error::使用中のタスク定義ARNを正しく取得できませんでした。"
            exit 1
          fi

          echo "PRODUCT_API_TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: 選択したスタックのテンプレートを生成
        run: |
          if [[ "$CDK_TARGET" == "EcsStack" || "$CDK_TARGET" == "--all" ]]; then
            npm run cdk -- synth "$CDK_TARGET" --quiet \
              -c "productApiTaskDefinitionArn=$PRODUCT_API_TASK_DEFINITION_ARN"
          else
            npm run cdk -- synth "$CDK_TARGET" --quiet
          fi
        working-directory: infra/cdk

      - name: デプロイ済みの設定との差分を確認
        run: |
          if [[ "$CDK_TARGET" == "EcsStack" || "$CDK_TARGET" == "--all" ]]; then
            npm run cdk -- diff "$CDK_TARGET" --method=template \
              -c "productApiTaskDefinitionArn=$PRODUCT_API_TASK_DEFINITION_ARN"
          else
            npm run cdk -- diff "$CDK_TARGET" --method=template
          fi
        working-directory: infra/cdk

      - name: 選択したスタックをデプロイ
        if: inputs.deploy
        run: |
          if [[ "$CDK_TARGET" == "EcsStack" || "$CDK_TARGET" == "--all" ]]; then
            npm run cdk -- deploy "$CDK_TARGET" \
              -c "productApiTaskDefinitionArn=$PRODUCT_API_TASK_DEFINITION_ARN" \
              --require-approval never
          else
            npm run cdk -- deploy "$CDK_TARGET" --require-approval never
          fi
        working-directory: infra/cdk
