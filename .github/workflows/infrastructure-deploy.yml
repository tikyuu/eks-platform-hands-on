name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '差分確認後にAWSへデプロイする（AWSリソースの変更・費用が発生する可能性があります）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: インフラを更新
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 24を準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: CDKの依存ライブラリをインストール
        run: npm ci
        working-directory: infra/cdk

      - name: CDKをビルド
        run: npm run build
        working-directory: infra/cdk

      - name: AWSへ認証
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 使用中のタスク定義ARNを取得
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster ecs-stg-cluster \
            --services ecs-stg-service-product-api \
            --query 'services[0].taskDefinition' \
            --output text)

          # タスク定義ARNの形式（末尾のリビジョン番号まで必要）
          TASK_DEFINITION_ARN_PATTERN='^arn:[a-z0-9-]+:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/[A-Za-z0-9_-]+:[1-9][0-9]*$'

          # 取得結果がその形式でなければ停止する
          if [[ ! "$TASK_DEFINITION_ARN" =~ $TASK_DEFINITION_ARN_PATTERN ]]; then
            echo "::error::使用中のタスク定義ARNを正しく取得できませんでした。"
            exit 1
          fi

          echo "PRODUCT_API_TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: 使用中のタスク定義を引き継いでテンプレートを生成
        run: |
          npm run cdk -- synth --quiet \
            -c "productApiTaskDefinitionArn=$PRODUCT_API_TASK_DEFINITION_ARN"
        working-directory: infra/cdk

      - name: デプロイ済みの設定との差分を確認
        run: |
          npm run cdk -- diff --all --method=template \
            -c "productApiTaskDefinitionArn=$PRODUCT_API_TASK_DEFINITION_ARN"
        working-directory: infra/cdk
