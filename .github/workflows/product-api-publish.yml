name: Product API Image Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: 商品APIのイメージをECRへpush
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AWSへ認証
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PRODUCT_API_PUSH_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: DBスタックのOutputsを取得
        run: |
          aws cloudformation describe-stacks \
            --stack-name DatabaseStack \
            --query 'Stacks[0].Outputs' \
            --output json > "$RUNNER_TEMP/product-api-database-outputs.json"

      - name: ECRへログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: 商品APIのイメージをビルド
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ecs-stg-ecr-product-api
        run: docker build --file apps/product-api/Dockerfile --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" apps/product-api

      - name: 商品APIのイメージをECRへpush
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ecs-stg-ecr-product-api
        run: docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
