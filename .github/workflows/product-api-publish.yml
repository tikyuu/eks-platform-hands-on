name: Product API Image Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: 商品APIのイメージをECRへpush
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AWSへ認証
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PRODUCT_API_PUSH_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: DBスタックのOutputsを取得
        run: |
          aws cloudformation describe-stacks \
            --stack-name DatabaseStack \
            --query 'Stacks[0].Outputs' \
            --output json > "$RUNNER_TEMP/product-api-database-outputs.json"

      - name: ECSスタックのOutputsを取得
        run: |
          aws cloudformation describe-stacks \
            --stack-name EcsStack \
            --query 'Stacks[0].Outputs' \
            --output json > "$RUNNER_TEMP/product-api-ecs-outputs.json"

      - name: タスク定義JSONにDB接続情報・実行ロール・ログ送信先を設定
        run: |
          DB_HOST=$(jq -r '
            .[]
            | select(.OutputKey == "DatabaseEndpointAddress")
            | .OutputValue
          ' "$RUNNER_TEMP/product-api-database-outputs.json")

          if [[ -z "$DB_HOST" || "$DB_HOST" == "null" ]]; then
            echo "::error::DatabaseEndpointAddressが取得できません。DatabaseStackのOutputsを確認してください。"
            exit 1
          fi

          DB_PORT=$(jq -r '
            .[]
            | select(.OutputKey == "DatabaseEndpointPort")
            | .OutputValue
          ' "$RUNNER_TEMP/product-api-database-outputs.json")

          if [[ -z "$DB_PORT" || "$DB_PORT" == "null" ]]; then
            echo "::error::DatabaseEndpointPortが取得できません。DatabaseStackのOutputsを確認してください。"
            exit 1
          fi

          DB_SECRET_ARN=$(jq -r '
            .[]
            | select(.OutputKey == "ProductApiDatabaseSecretArn")
            | .OutputValue
          ' "$RUNNER_TEMP/product-api-database-outputs.json")

          if [[ -z "$DB_SECRET_ARN" || "$DB_SECRET_ARN" == "null" ]]; then
            echo "::error::ProductApiDatabaseSecretArnが取得できません。DatabaseStackのOutputsを確認してください。"
            exit 1
          fi

          EXECUTION_ROLE_ARN=$(jq -r '
            .[]
            | select(.OutputKey == "ProductApiExecutionRoleArn")
            | .OutputValue
          ' "$RUNNER_TEMP/product-api-ecs-outputs.json")

          if [[ -z "$EXECUTION_ROLE_ARN" || "$EXECUTION_ROLE_ARN" == "null" ]]; then
            echo "::error::ProductApiExecutionRoleArnが取得できません。EcsStackのOutputsを確認してください。"
            exit 1
          fi

          LOG_GROUP_NAME=$(jq -r '
            .[]
            | select(.OutputKey == "ProductApiLogGroupName")
            | .OutputValue
          ' "$RUNNER_TEMP/product-api-ecs-outputs.json")

          if [[ -z "$LOG_GROUP_NAME" || "$LOG_GROUP_NAME" == "null" ]]; then
            echo "::error::ProductApiLogGroupNameが取得できません。EcsStackのOutputsを確認してください。"
            exit 1
          fi

          jq --arg db_host "$DB_HOST" \
            --arg db_port "$DB_PORT" \
            --arg db_secret_arn "$DB_SECRET_ARN" \
            --arg execution_role_arn "$EXECUTION_ROLE_ARN" \
            --arg log_group_name "$LOG_GROUP_NAME" '
            .executionRoleArn = $execution_role_arn
            | (.containerDefinitions[]
              | select(.name == "ProductApiContainer")
              | .environment[]
              | select(.name == "PRODUCT_API_DB_HOST")
              | .value) = $db_host
            | (.containerDefinitions[]
              | select(.name == "ProductApiContainer")
              | .environment[]
              | select(.name == "PRODUCT_API_DB_PORT")
              | .value) = $db_port
            | (.containerDefinitions[]
              | select(.name == "ProductApiContainer")
              | .secrets[]
              | select(.name == "PRODUCT_API_DB_USER")
              | .valueFrom) = ($db_secret_arn + ":username::")
            | (.containerDefinitions[]
              | select(.name == "ProductApiContainer")
              | .secrets[]
              | select(.name == "PRODUCT_API_DB_PASSWORD")
              | .valueFrom) = ($db_secret_arn + ":password::")
            | (.containerDefinitions[]
              | select(.name == "ProductApiContainer")
              | .logConfiguration.options["awslogs-group"]) = $log_group_name
          ' apps/product-api/ecs/task-definition.json \
            > "$RUNNER_TEMP/product-api-task-definition.json"

      - name: ECRへログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: 商品APIのイメージをビルド
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ecs-stg-ecr-product-api
        run: docker build --file apps/product-api/Dockerfile --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" apps/product-api

      - name: 商品APIのイメージをECRへpush
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ecs-stg-ecr-product-api
        run: docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: タスク定義JSONに配信イメージを設定
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: ${{ runner.temp }}/product-api-task-definition.json
          container-name: ProductApiContainer
          image: ${{ steps.login-ecr.outputs.registry }}/ecs-stg-ecr-product-api:${{ env.IMAGE_TAG }}

      - name: 商品APIのタスク定義を登録してサービスを更新
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ecs-stg-cluster
          service: ecs-stg-service-product-api
          wait-for-service-stability: true
